<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Playground</title>
  <link rel="stylesheet" href="theme.css">
  <style>
    main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
    h1 { margin: 0 0 4px; }
    p.sub { margin: 0 0 32px; color: var(--muted); }
    ul { list-style: none; padding: 0; display: grid; gap: 12px; }
    a.card { display: block; color: inherit; text-decoration: none; }
    a.card:hover { border-color: var(--accent); }
    a.card strong { display: block; }
    a.card span { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Playground</h1>
    <p class="sub">Eksperymenty w moim stylu.</p>
    <ul>
      <li><a class="card" href="experiments/example/"><strong>Example</strong><span>Szablon eksperymentu: skopiuj folder i zmień.</span></a></li>
    </ul>
  </main>
</body>
</html>
