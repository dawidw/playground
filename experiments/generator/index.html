<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generator</title>
  <link rel="stylesheet" href="../../browser.css?v=202610041254">
  <link rel="stylesheet" href="../../theme.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="../../tailwind-config.js"></script>
</head>
<body>
  <main class="flex w-full flex-col gap-10 px-10 py-12">
    <header class="flex flex-col gap-4 pb-6">
      <a href="../../" class="text-md text-muted">← Playground</a>
      <div>
        <h1 class="text-3xl font-semibold">Generator</h1>
        <p class="text-md text-muted">Seeded backgrounds in the spirit of the Polish poster school and Fangor's soft op art.</p>
      </div>
    </header>
    <div class="canvas">
      <div class="window">
      <div class="toolbar" aria-hidden="true">
        <div class="lights"><i></i><i></i><i></i></div>
        <span class="pill-btn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M9.5 5v14"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg></span>
        <span class="pill-btn back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.4"><path d="m9 6 6 6-6 6"/></svg></span>
        <div class="url"><span>acme.com</span></div>
        <div class="tb-icons"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v10m0 0-4-4m4 4 4-4M5 19h14"/></svg></span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 0L8 8m4-4 4 4M6 12v7h12v-7"/></svg></span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span></div>
      </div>
      <!-- Stage: bg/light background, rounded-3xl, Shadow/Card. The generator UI lives here. -->
      <section id="stage" class="flex min-h-[200px] w-full flex-col items-start gap-2 rounded-3xl bg-light px-10 py-10 shadow-card">
        <div class="grid w-full grid-cols-1 gap-10 lg:grid-cols-[minmax(0,1fr)_320px]">
          <div class="flex min-w-0 flex-col gap-4">
            <div class="grid place-items-center rounded-2xl bg-gray-0-5 p-8">
              <img id="preview" alt="Generated background" class="block h-auto max-h-[62vh] w-auto max-w-full shadow-card">
            </div>
            <div class="flex items-center justify-between gap-4">
              <span id="recipe" class="font-mono text-base text-muted-light"></span>
              <div id="hist" class="hist"></div>
            </div>
          </div>

          <aside class="flex min-w-0 flex-col gap-5">
            <div class="field">
              <span class="lbl">Family</span>
              <div class="seg" role="group" aria-label="Family">
                <button type="button" id="g-poster" aria-pressed="true">Poster</button>
                <button type="button" id="g-fangor" aria-pressed="false">Fangor</button>
                <button type="button" id="g-soft" aria-pressed="false">Soft ring</button>
              </div>
            </div>

            <div class="field" id="motif-field">
              <label class="lbl" for="motif">Motif</label>
              <select id="motif" class="control"></select>
            </div>

            <div class="field">
              <label class="lbl" for="palette">Palette</label>
              <select id="palette" class="control"></select>
              <div class="sw" id="swatches" aria-label="Palette colors"></div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-base text-muted-light">Click a swatch to change a color.</span>
                <button type="button" class="btn-light" id="resetColors" hidden>Reset</button>
              </div>
              <button type="button" class="btn-light" id="rollColors">Randomize colors</button>
            </div>

            <div class="field" id="size-field" hidden>
              <span class="lbl">Circle</span>
              <div class="grid grid-cols-[32px_minmax(0,1fr)_48px] items-center gap-x-3 gap-y-2 text-base text-muted-light">
                <label for="csize">Size</label>
                <input type="range" id="csize" min="0.5" max="1.5" step="0.01" value="1">
                <span id="csizeVal" class="text-right font-mono">Auto</span>
                <label for="cx">X</label>
                <input type="range" id="cx" min="0" max="1" step="0.005" value="0.5">
                <span id="cxVal" class="text-right font-mono">Auto</span>
                <label for="cy">Y</label>
                <input type="range" id="cy" min="0" max="1" step="0.005" value="0.5">
                <span id="cyVal" class="text-right font-mono">Auto</span>
              </div>
              <div class="flex items-center justify-between gap-2">
                <span class="text-base text-muted-light">Or drag the circle on the preview.</span>
                <button type="button" class="btn-light" id="csizeAuto">Auto</button>
              </div>
            </div>

            <div class="field">
              <label class="lbl" for="seed">Seed</label>
              <div class="flex gap-2">
                <button type="button" class="btn-light" id="seedPrev" aria-label="Previous seed">‹</button>
                <input type="number" id="seed" class="control" min="0" max="999999" step="1" value="7">
                <button type="button" class="btn-light" id="seedNext" aria-label="Next seed">›</button>
                <button type="button" class="btn-light" id="seedRand">Random</button>
              </div>
            </div>

            <div class="field">
              <span class="lbl">Size</span>
              <div class="chips" id="sizes" role="group" aria-label="Size"></div>
              <div class="grid grid-cols-[1fr_auto_1fr] items-center gap-2 text-muted-light">
                <input type="number" id="w" class="control" min="200" max="4000" step="10" aria-label="Width">
                <span>×</span>
                <input type="number" id="h" class="control" min="200" max="4000" step="10" aria-label="Height">
              </div>
            </div>

            <div class="field">
              <span class="lbl">Randomize</span>
              <div class="flex flex-wrap gap-x-4 gap-y-1 text-base text-ink-light">
                <label class="check"><input type="checkbox" id="lockMotif"> Lock motif</label>
                <label class="check"><input type="checkbox" id="lockPalette"> Lock palette</label>
                <label class="check"><input type="checkbox" id="randColors"> Random colors</label>
              </div>
              <button type="button" class="btn-dark" id="rollAll"><span class="btn-label">Randomize all</span></button>
              <div class="grid grid-cols-3 gap-2">
                <button type="button" class="btn-light" id="dlSvg">SVG</button>
                <button type="button" class="btn-light" id="dlPng">PNG</button>
                <button type="button" class="btn-light" id="copyCmd">Command</button>
              </div>
              <div class="toast-line" id="toast" role="status"></div>
            </div>
          </aside>
        </div>
      </section>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
